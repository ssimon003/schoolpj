# It autodiscovers the new folders inside charts, so the addition of new application in folder normal is automatic.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: normal-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/<your-user>/<your-repo>
        revision: HEAD
        directories:
          - path: charts/normal/*        # auto-discovers every subfolder
  template:
    metadata:
      name: "{{path.basename}}"          # app name = folder name (e.g. nginx, apache)
    spec:
      project: default
      source:
        repoURL: https://github.com/<your-user>/<your-repo>
        targetRevision: HEAD
        path: "{{path}}"                 # each app points to its own folder
      destination:
        server: https://kubernetes.default.svc
        namespace: normal
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true